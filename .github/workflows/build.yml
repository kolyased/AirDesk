name: Windows build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build AirDesk.slnx -c Release
      - run: dotnet run --project tests -c Release
      - name: Build portable package
        shell: pwsh
        run: ./scripts/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AirDesk-portable-win-x64
          path: |
            dist/*-Portable-win-x64.zip
            dist/*-SHA256.txt
          if-no-files-found: error
